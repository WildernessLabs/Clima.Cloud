name: Build

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - develop
  workflow_call:
    inputs:
      working_directory:
        required: true
        description: 'The working directory for the project'
        type: string
      project_name:
        required: true
        description: 'The project file name'
        type: string
      environment:
        required: true
        description: 'The environment: staging, production'
        type: string

  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs: 
  build: 
    name: Build
    runs-on: ubuntu-latest
    
    env:
      ASPNETCORE_ENVIRONMENT: ${{ inputs.environment }}
      
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.0' # Specify your .NET Core version here

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.project_name }}
        working-directory: ${{ inputs.working_directory }}

      - name: Build
        run: dotnet build ${{ inputs.project_name }} --configuration Release --no-restore
        working-directory: ${{ inputs.working_directory }}

      - name: Run tests
        run: dotnet test ${{ inputs.project_name }} --no-restore --verbosity normal
        working-directory: ${{ inputs.working_directory }}
        env:
          ASPNETCORE_ENVIRONMENT: ${{ inputs.environment }}  

      - name: Publish
        run: dotnet publish ${{ inputs.project_name }} --configuration Release --no-build --output ./artifacts
        working-directory: ${{ inputs.working_directory }}
        env:
          ASPNETCORE_ENVIRONMENT: ${{ inputs.environment }}  

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: ${{ inputs.working_directory }}/artifacts/
          retention-days: 1
