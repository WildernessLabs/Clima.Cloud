name: Deploy WEB to Staging

on:
  push:
    branches:
      - develop
    paths:
      - "ClimaCloud.Web/**"
      - "ClimaCloud.Shared/**"
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      working_directory: "./ClimaCloud.Web"
      project_name: "ClimaCloud.Web.csproj"
      environment: "staging"

  deploy_web:
    name: Deploy WEB to Staging
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: staging
      url: https://orange-sea-0db902b10.5.azurestaticapps.net

    concurrency: staging-climacloud-web

    env: 
      AZURE_WEBAPP_NAME: stapp-climacloud-stg-cus
      AZURE_WEBAPP_PACKAGE_PATH: "./artifacts/wwwroot"

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts
      
      - name: Deploy to Azure Web App
        uses: azure/static-web-apps-deploy@v1
        with:
          action: "upload"
          azure_static_web_apps_api_token: ${{ secrets.CLIMA_CLOUD_WEB_STG_PUBLISH_TOKEN }}
          app_location: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
